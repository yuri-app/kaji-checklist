<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家事代行チェックリスト</title>
<meta name="description" content="家庭ごとの作業を入室から退出まで順にチェックする、家事代行スタッフ向けのスマホ用チェックリスト。">
<meta name="theme-color" content="#2B4C7E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家事代行">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface2:#F5F8F6; --ink:#1B2621; --muted:#5B6B64; --line:#D3DCD8;
  --accent:#2B4C7E; --accent-ink:#FFFFFF; --accent-soft:#E2E9F3;
  --ok:#2A7652; --ok-ink:#FFFFFF; --ok-soft:#DCEEE4;
  --warn:#9A5F14; --warn-soft:#F5E8D3;
  --danger:#AE3A2E; --danger-soft:#F5DDD9;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 4px 14px rgba(20,40,30,.05);
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  --f-head:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111714; --surface:#19211D; --surface2:#1F2924; --ink:#E5EDE9; --muted:#9BAEA5; --line:#2D3A34;
    --accent:#90AFE0; --accent-ink:#0E1828; --accent-soft:#1E2A3C;
    --ok:#6DC99A; --ok-ink:#0C1F15; --ok-soft:#1A3227;
    --warn:#E2AA5E; --warn-soft:#382B19;
    --danger:#EE8C80; --danger-soft:#3B201C;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111714; --surface:#19211D; --surface2:#1F2924; --ink:#E5EDE9; --muted:#9BAEA5; --line:#2D3A34;
  --accent:#90AFE0; --accent-ink:#0E1828; --accent-soft:#1E2A3C;
  --ok:#6DC99A; --ok-ink:#0C1F15; --ok-soft:#1A3227;
  --warn:#E2AA5E; --warn-soft:#382B19;
  --danger:#EE8C80; --danger-soft:#3B201C;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 96px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:1.45rem;font-weight:700}
h2{font-size:1.1rem;font-weight:700}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.78rem;letter-spacing:.06em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.86rem}

/* top of list */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:8px}
.top h1{font-size:1.35rem}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;text-decoration:none;color:var(--ink);text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.go{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.btn.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn.danger{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.btn.big{min-height:60px;font-size:1.08rem;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.sm{min-height:40px;padding:6px 14px;font-size:.92rem}
.linkbtn{background:none;border:0;padding:6px 2px;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.btnrow > *{flex:1 1 140px}

/* sections */
.section{display:flex;flex-direction:column;gap:10px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

/* home cards */
.homes{display:flex;flex-direction:column;gap:10px}
.home{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.home .name{font-family:var(--f-head);font-weight:700;font-size:1.08rem}
.home .meta{grid-column:1;font-size:.86rem;color:var(--muted)}
.home .chev{grid-row:1 / span 2;grid-column:2;color:var(--muted);font-size:1.3rem}
.home.active{border-color:var(--ok);border-width:2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.on{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.flow-label{margin:4px 0 -4px;font-size:.78rem;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.pill.tag{font-size:.7rem;padding:0 8px;vertical-align:middle;font-weight:500}
.timeedit{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.timeedit input{flex:1 1 100%;width:auto}
.timeedit .btn{flex:1 1 0}
.linkrow{display:flex;flex-wrap:wrap;gap:4px 18px}
button.log-row{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;font:inherit;font-size:.9rem;color:inherit;cursor:pointer}
button.log-row:first-child{border-top:0}
.home .sched{margin-left:10px;font-family:var(--f-body);font-size:.88rem;font-weight:500;color:var(--muted);white-space:nowrap}
.weekpick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk{min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;color:var(--muted);padding:0}
.wk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.home.due{border-color:var(--warn);border-width:2px}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rhead .btn{flex:none;min-height:36px;padding:4px 14px}
textarea[readonly],input[readonly]{background:var(--surface2)}
.time2{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
input[type=time]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:46px}
button.notice{font:inherit;font-size:.88rem;width:100%;cursor:pointer}
.pill.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}

.notice{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:.88rem}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted)}

/* log */
.log{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.log-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:10px 14px;border-top:1px solid var(--line);font-size:.9rem}
.log-row:first-child{border-top:0}
.log-row .d{color:var(--muted)}
.log-row .n{font-weight:700;overflow-wrap:anywhere}

/* visit bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding:8px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bar-top .t{font-family:var(--f-head);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;text-align:center}
.navbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:8px 4px;min-height:40px;white-space:nowrap}
.meter{display:flex;gap:12px;font-size:.8rem;color:var(--muted)}
.meter > div{flex:1;display:flex;flex-direction:column;gap:3px}
.track{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .25s}

.memo{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:.93rem;white-space:pre-wrap;overflow-wrap:anywhere}
.memo b{display:block;font-size:.78rem;letter-spacing:.06em;color:var(--accent);margin-bottom:2px}

/* steps */
.step{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.step-h{display:flex;align-items:center;gap:10px}
.step-h .no{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.step-h .no.ok{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.step-h h2{flex:1}
.step-h .count{font-size:.9rem;color:var(--muted);font-weight:700}
.step.locked .checks{opacity:.5}
.okline{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ok);font-size:1.05rem}

.checks{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.check{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:10px 14px;text-align:left;background:var(--surface);border:0;border-top:1px solid var(--line);-webkit-tap-highlight-color:transparent}
.check:first-child{border-top:0}
.check:disabled{cursor:default}
.box{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;transition:background .15s,border-color .15s}
.box svg{width:18px;height:18px;opacity:0}
.check[aria-checked="true"]{background:var(--ok-soft)}
.check[aria-checked="true"] .box{background:var(--ok);border-color:var(--ok)}
.check[aria-checked="true"] .box svg{opacity:1}
.check[aria-checked="true"] .txt{color:var(--muted)}
.check .txt{overflow-wrap:anywhere}

.alert{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.danger{background:var(--danger-soft);color:var(--danger)}
.alert ul{margin:0;padding-left:1.2em;color:var(--ink)}

.howto{margin:0;padding:10px 14px 10px 2.2em;background:var(--accent-soft);border-radius:12px;font-size:.93rem;display:flex;flex-direction:column;gap:2px}
.howto b{color:var(--accent)}
.msgbox{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.95rem;user-select:text;-webkit-user-select:text}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-weight:700;font-size:.92rem}
.field .hint{font-size:.82rem;color:var(--muted)}
input[type=text],textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px}
textarea{min-height:88px;resize:vertical}
.editor{display:flex;flex-direction:column;gap:8px}
.ed-row{display:grid;grid-template-columns:1fr repeat(3,40px);gap:6px;align-items:center}
.ed-row button{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:1rem;padding:0}
.ed-row button[data-act="rm"]{color:var(--danger)}
.ed-row button:disabled{opacity:.35}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}

.donecard{background:var(--surface);border:2px solid var(--ok);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.donecard h1{color:var(--ok)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.95rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:700}

#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;font-weight:700;max-width:calc(100% - 32px);text-align:center;z-index:20}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><p class="loading">読み込み中…</p></div>
<div id="toast" role="status" hidden></div>

<script>
(function(){
"use strict";

const DEFAULT_FINALS = [
  "使った道具・洗剤を片付けた",
  "ゴミをまとめた（指定の場所へ）",
  "照明・エアコンを元の状態に戻した",
  "火の元・水道の閉め忘れがない",
  "窓の戸締まりをした",
  "忘れ物がない（自分の荷物・鍵）",
  "玄関の施錠・鍵の返却をした"
];
const DEFAULT_SETTINGS = {
  staff: "",
  inTpl: "【入室】{家庭} {時刻} 入室しました。",
  outTpl: "【退出】{家庭} {時刻} 退出しました。",
  fullName: "",
  email: "",
  reportUrl: ""
};
const SAMPLE_HOME = {
  name: "（例）見本様",
  start: "10:00",
  end: "12:00",
  days: ["火", "金"],
  memo: "これは見本です。自分の訪問先を登録したら、「編集」→「この家庭を削除」で消してください。\n鍵：ポスト内のキーボックス／猫がいるので玄関の開け閉めに注意",
  tasks: [
    "玄関の掃き掃除・靴をそろえる",
    "キッチン：シンク・コンロ・作業台を拭く",
    "浴室：浴槽・床・排水口",
    "トイレ掃除（便器・床・タオル交換）",
    "リビング・寝室に掃除機をかける",
    "洗濯物をたたんで寝室へ",
    "冷蔵庫の賞味期限チェック"
  ]
};
const EXPORT_APP = "kaji-checklist";
const LOCAL_KEY = "kaji-checklist-v1";
const LOG_MAX = 60;

const S = {
  mode: "loading",          // loading | db | local
  homes: {}, visits: {}, settings: Object.assign({}, DEFAULT_SETTINGS), log: [], reports: {},
  view: { name: "list" },
  ui: {},
  got: {}
};
let db = null;
const app = document.getElementById("app");

/* ---------- helpers ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, "0");
const fmtTime = iso => { const d = new Date(iso); return d.getHours() + ":" + pad(d.getMinutes()); };
const fmtDate = iso => { const d = new Date(iso); return (d.getMonth()+1) + "月" + d.getDate() + "日(" + "日月火水木金土"[d.getDay()] + ")"; };
const fmtDur = (a, b) => { const m = Math.max(0, Math.round((new Date(b) - new Date(a)) / 60000)); return (m >= 60 ? Math.floor(m/60) + "時間" : "") + (m % 60) + "分"; };
const toHHMM = iso => { const d = new Date(iso); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
// baseIso と同じ日の hh:mm にした日時
function atTime(baseIso, hhmm){ const d = new Date(baseIso), [h, m] = hhmm.split(":").map(Number); d.setHours(h, m, 0, 0); return d.toISOString(); }
function timeForm(id, value, okAct, okLabel, uiKey){
  return '<div class="timeedit"><input type="time" id="' + id + '" value="' + value + '" aria-label="時刻">'
    + '<button class="btn sm primary" data-act="' + okAct + '">' + okLabel + '</button>'
    + '<button class="btn sm" data-act="ui" data-key="' + uiKey + '">やめる</button></div>';
}
const WEEK = ["月", "火", "水", "木", "金", "土", "日"]; // 表示順（月曜はじまり）
function scheduleText(h){
  const days = WEEK.filter(w => (h.days || []).includes(w)).join("・");
  const time = h.start ? hm(h.start) + "〜" + (h.end ? hm(h.end) : "") : "";
  return [days, time].filter(Boolean).join(" ");
}
const EDITED_TAG = '<span class="pill tag">修正</span>';
const dayKey = iso => { const d = new Date(iso); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const fmtDay = key => { const [y, m, d] = key.split("-").map(Number); return fmtDate(new Date(y, m - 1, d).toISOString()); };
const hm = v => String(v || "").replace(/^0(\d)/, "$1"); // "09:00" → "9:00"
// 日報フォームのアドレスに {名前} などの差し込みがあれば、日報の内容を入れたアドレスにする
const PREFILL_RE = /\{(名前|メール|日付|お客様|時間|交通費|交通費詳細|休憩|報告)\}/g;
const hasPrefill = url => /\{(名前|メール|日付)\}/.test(url || "");
// お名前・メール・お伺い日だけ入れる（お客様名や時間などはフォームで手入力）
function prefillUrl(url, day){
  return url.replace(PREFILL_RE, (m, k) =>
    k === "日付" ? day : k === "名前" ? encodeURIComponent(S.settings.fullName || "") : k === "メール" ? encodeURIComponent(S.settings.email || "") : "");
}

const lineUrl = text => "https://line.me/R/share?text=" + encodeURIComponent(text);
const LINE_HOWTO = '<ol class="howto"><li>送信先のトークを選ぶ</li><li>右上の<b>「転送」</b>を押すと送られます</li></ol>'
  + '<p class="small muted">連絡文は画面に出ませんが、転送すると届きます。下の「メッセージを入力」は空のままで大丈夫です。</p>';
const CHECK_SVG ='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--ok-ink)"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function message(kind, home, iso, settings){
  const st = settings || S.settings;
  const tpl = (kind === "in" ? st.inTpl : st.outTpl) || "";
  return tpl
    .replace(/\{家庭\}/g, home.name || "")
    .replace(/\{時刻\}/g, fmtTime(iso))
    .replace(/\{日付\}/g, fmtDate(iso))
    .replace(/\{担当\}/g, st.staff || "")
    .replace(/[ 　]{2,}/g, " ").trim();
}
function sortedHomes(){
  return Object.values(S.homes).sort((a, b) => (a.sort || 0) - (b.sort || 0) || String(a.name).localeCompare(String(b.name), "ja"));
}
function counts(home, visit){
  const tasks = home.tasks || [], finals = home.finals || [];
  const done = visit ? tasks.filter(t => visit.done && visit.done[t.id]).length : 0;
  const fin = visit ? finals.filter(t => visit.final && visit.final[t.id]).length : 0;
  return { tasks: tasks.length, done, finals: finals.length, fin };
}

let toastTimer = null;
function toast(text){
  const el = document.getElementById("toast");
  el.textContent = text; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}
async function copyText(text, field){
  try { await navigator.clipboard.writeText(text); toast(field ? "コピーしました" : "文面をコピーしました"); }
  catch (e) {
    if (field) { field.focus(); field.select(); }
    else {
      const box = document.querySelector("[data-msgbox]");
      if (box) { const r = document.createRange(); r.selectNodeContents(box); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    }
    toast("文字を選択しました。長押しでコピーしてください");
  }
}

/* ---------- storage ---------- */
const queues = {};
function write(path, data){ // data === null で削除
  if (S.mode !== "db") { saveLocal(); return; }
  const q = queues[path] || (queues[path] = { pending: undefined, running: false });
  q.pending = data;
  if (!q.running) flush(path);
}
async function flush(path){
  const q = queues[path]; q.running = true;
  while (q.pending !== undefined) {
    const data = q.pending; q.pending = undefined;
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        if (data === null) await db.doc(path).delete(); else await db.doc(path).set(data);
        break;
      } catch (e) {
        const code = e && e.code;
        if (code === "unavailable" && attempt === 0) { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); continue; }
        toast(code === "quota_exceeded" ? "保存できる件数の上限です。使わない家庭を削除してください" : "保存できませんでした。通信状態を確認してください");
        break;
      }
    }
  }
  q.running = false;
}
function saveLocal(){
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ homes: S.homes, visits: S.visits, settings: S.settings, log: S.log, reports: S.reports })); } catch (e) {}
}
function loadLocal(){
  try {
    const d = JSON.parse(localStorage.getItem(LOCAL_KEY) || "null");
    if (d) { S.homes = d.homes || {}; S.visits = d.visits || {}; S.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings || {}); S.log = d.log || []; S.reports = d.reports || {}; }
  } catch (e) {}
}
function startLocal(){ S.mode = "local"; loadLocal(); render(); }

function startDb(){
  S.mode = "db";
  const onErr = () => toast("データを読み込めません。ページを開き直してください");
  const mark = key => { if (!S.got[key]) { S.got[key] = true; } };
  db.collection("homes").onSnapshot(snap => {
    const h = {}; snap.docs.forEach(d => { h[d.id] = Object.assign({ id: d.id }, d.data()); });
    S.homes = h; mark("homes"); softRender();
  }, onErr);
  db.collection("visits").onSnapshot(snap => {
    const v = {}; snap.docs.forEach(d => { v[d.id] = clone(d.data()); });
    S.visits = v; mark("visits"); softRender();
  }, onErr);
  db.doc("settings/main").onSnapshot(snap => {
    S.settings = Object.assign({}, DEFAULT_SETTINGS, snap.exists ? snap.data() : {}); mark("settings"); softRender();
  }, onErr);
  db.doc("log/recent").onSnapshot(snap => {
    S.log = snap.exists ? clone(snap.data().entries || []) : []; mark("log"); softRender();
  }, onErr);
  db.collection("reports").onSnapshot(snap => {
    const r = {}; snap.docs.forEach(d => { r[d.id] = clone(d.data()); });
    S.reports = r; mark("reports"); softRender();
  }, onErr);
}
// 入力中の画面（編集・設定・日報）はデータ更新で描き直さない
function softRender(){
  if (S.view.name === "edit" || S.view.name === "settings" || S.view.name === "report" || S.view.name === "logEdit") return;
  render();
}

/* ---------- actions ---------- */
function go(view){ S.view = view; S.ui = {}; render(); window.scrollTo(0, 0); }

function enter(id, iso, edited){
  S.visits[id] = { inAt: iso, done: {}, final: {} };
  if (edited) S.visits[id].inEdited = true;
  write("visits/" + id, S.visits[id]); render();
}
function cancelEntry(id){
  delete S.visits[id]; write("visits/" + id, null); S.ui = {}; render(); toast("入室を取り消しました");
}
function toggle(id, kind, itemId){
  const v = S.visits[id]; if (!v) return;
  const map = kind === "task" ? (v.done = v.done || {}) : (v.final = v.final || {});
  if (map[itemId]) delete map[itemId]; else map[itemId] = true;
  write("visits/" + id, v); render();
}
function exitVisit(id, outAt, edited){
  const home = S.homes[id], v = S.visits[id]; if (!home || !v) return;
  const c = counts(home, v);
  const entry = { homeId: id, name: home.name, inAt: v.inAt, outAt, done: c.done, total: c.tasks };
  if (edited || v.inEdited) entry.edited = true;
  S.log = [entry].concat(S.log).slice(0, LOG_MAX);
  write("log/recent", { entries: S.log });
  delete S.visits[id]; write("visits/" + id, null);
  go({ name: "done", entry, text: message("out", home, outAt) });
}

/* ---------- views ---------- */
function render(){
  if (S.mode === "loading" || (S.mode === "db" && !(S.got.homes && S.got.visits && S.got.settings && S.got.log && S.got.reports))) {
    app.innerHTML = '<p class="loading">読み込み中…</p>'; return;
  }
  const v = S.view;
  if (v.name === "visit" && !S.homes[v.id]) S.view = { name: "list" };
  const html = { list: viewList, visit: viewVisit, edit: viewEdit, settings: viewSettings, done: viewDone, report: viewReport, logEdit: viewLogEdit }[S.view.name]();
  app.innerHTML = html;
  if (S.view.name === "edit") { renderEditor("tasks"); renderEditor("finals"); }
  keepAwake(S.view.name === "visit" && !!S.visits[S.view.id]);
}

/* --- 日報 --- */
function dayEntries(key){
  return S.log.filter(e => dayKey(e.inAt) === key).sort((a, b) => new Date(a.inAt) - new Date(b.inAt));
}
// 過去7日のうち、訪問があって日報が未送信の日（新しい順）
function pastUnsent(){
  const today = dayKey(new Date().toISOString()), cutoff = Date.now() - 7 * 864e5;
  return [...new Set(S.log.map(e => dayKey(e.inAt)))]
    .filter(k => k !== today && new Date(k + "T00:00").getTime() >= cutoff && !(S.reports[k] && S.reports[k].sent))
    .sort().reverse();
}
function viewReportRows(){
  const today = dayKey(new Date().toISOString()), past = pastUnsent();
  const row = (key, label) => {
    const n = dayEntries(key).length, sent = S.reports[key] && S.reports[key].sent;
    const pill = sent ? '<span class="pill on">送信済み</span>'
      : n ? '<span class="pill warn dot">未送信</span>' : '<span class="pill">訪問なし</span>';
    return '<button class="home' + (!sent && n ? " due" : "") + '" data-act="report" data-day="' + key + '">'
      + '<span class="name">' + label + '</span><span class="chev" aria-hidden="true">›</span>'
      + '<span class="meta num">' + esc(fmtDay(key)) + (n ? '・訪問 ' + n + '件' : '') + '　' + pill + '</span></button>';
  };
  return '<p class="flow-label">最後に</p><div class="homes">'
    + row(today, "業務日報（今日）") + past.map(k => row(k, "業務日報（未送信）")).join("") + '</div>';
}

    + '</div>';

    + '<div class="card"><p class="flow-label">次は</p><h2>業務日報</h2><p class="small muted">その日の最後の訪問が終わったら、業務日報を送って仕事の完了です。</p>'
    + '<button class="btn big primary" data-act="report" data-day="' + dayKey(e.outAt) + '">業務日報へ進む</button></div>'
    + '<button class="btn" data-act="back">一覧へ戻る</button>';
}

/* --- edit --- */
function viewEdit(){
  const d = S.view.draft, isNew = S.view.isNew;
  let out = '<div class="bar"><div class="bar-top"><button class="navbtn" data-act="editCancel">キャンセル</button><span class="t">' + (isNew ? "家庭を追加" : "家庭を編集") + '</span>'
    + '<button class="navbtn" data-act="editSave">保存</button></div></div>';
  out += '<div class="card"><div class="field"><label for="f-name">家庭の名前</label><input type="text" id="f-name" value="' + esc(d.name) + '" placeholder="例：佐藤様"></div>'
    + '<div class="field"><span class="lbl">訪問曜日</span><div class="weekpick">'
    + WEEK.map(w => '<button type="button" class="wk" data-act="wk" data-w="' + w + '" aria-pressed="' + ((d.days || []).includes(w) ? "true" : "false") + '">' + w + '</button>').join("")
    + '</div><span class="hint">複数選べます。一覧で名前の後ろに表示されます。</span></div>'
    + '<div class="field"><span class="lbl">予定時刻</span><div class="time2"><input type="time" id="f-start" value="' + esc(d.start) + '" aria-label="開始"><span class="muted">〜</span><input type="time" id="f-end" value="' + esc(d.end) + '" aria-label="終了"></div>'
    + '<span class="hint">一覧で名前の後ろに表示されます。</span></div>'
    + '<div class="field"><label for="f-memo">メモ・注意事項</label><textarea id="f-memo" placeholder="例：鍵の受け取り方法、ペット、触ってはいけない物など">' + esc(d.memo) + '</textarea>'
    + '<span class="hint">作業画面の一番上に表示されます。</span></div></div>';
  out += '<div class="card"><div class="section-head"><h2>作業</h2><span class="small muted">上から順に表示</span></div><div class="editor" id="ed-tasks"></div>'
    + '<button class="btn sm" data-act="add" data-list="tasks">＋ 作業を追加</button></div>';
  out += '<div class="card"><div class="section-head"><h2>最終確認</h2><span class="small muted">全部済むと退出できます</span></div><div class="editor" id="ed-finals"></div>'
    + '<button class="btn sm" data-act="add" data-list="finals">＋ 確認項目を追加</button></div>';
  out += '<button class="btn big primary" data-act="editSave">保存する</button>';
  if (!isNew) {
    out += S.ui.confirmDelete
      ? '<div class="alert danger"><p>「' + esc(d.name) + '」と作業リストを削除します。元に戻せません。</p><div class="btnrow"><button class="btn sm danger" data-act="homeDelete">削除する</button><button class="btn sm" data-act="ui" data-key="confirmDelete" data-keep="1">やめる</button></div></div>'
      : '<button class="btn danger" data-act="ui" data-key="confirmDelete" data-on="1" data-keep="1">この家庭を削除</button>';
  }
  return out;
}
function renderEditor(list){
  const el = document.getElementById("ed-" + list); if (!el) return;
  const items = S.view.draft[list];
  const ph = list === "tasks" ? "例：浴室（浴槽・床・排水口）" : "例：窓の戸締まり";
  el.innerHTML = items.length ? items.map((t, i) =>
    '<div class="ed-row"><input type="text" id="it-' + esc(t.id) + '" data-list="' + list + '" data-item="' + esc(t.id) + '" value="' + esc(t.text) + '" placeholder="' + ph + '" enterkeyhint="next" aria-label="' + (i+1) + '番目">'
    + '<button data-act="up" data-list="' + list + '" data-item="' + esc(t.id) + '" aria-label="上へ"' + (i === 0 ? " disabled" : "") + '>↑</button>'
    + '<button data-act="down" data-list="' + list + '" data-item="' + esc(t.id) + '" aria-label="下へ"' + (i === items.length - 1 ? " disabled" : "") + '>↓</button>'
    + '<button data-act="rm" data-list="' + list + '" data-item="' + esc(t.id) + '" aria-label="削除">×</button></div>'
  ).join("") : '<p class="small muted">項目がありません。</p>';
}
function addItem(list, afterId){
  const items = S.view.draft[list], item = { id: uid(), text: "" };
  const at = afterId ? items.findIndex(t => t.id === afterId) + 1 : items.length;
  items.splice(at, 0, item); renderEditor(list);
  const inp = document.getElementById("it-" + item.id); if (inp) inp.focus();
}
function saveEdit(){
  const d = S.view.draft;
  d.name = d.name.trim();
  if (!d.name) { toast("家庭の名前を入力してください"); const n = document.getElementById("f-name"); if (n) n.focus(); return; }
  const clean = arr => arr.map(t => ({ id: t.id, text: t.text.trim() })).filter(t => t.text);
  const id = d.id || uid();
  const rec = { name: d.name, memo: d.memo.trim(), start: d.start || "", end: d.end || "", days: WEEK.filter(w => (d.days || []).includes(w)), tasks: clean(d.tasks), finals: clean(d.finals), sort: d.sort };
  if (S.view.isNew) rec.sort = Math.max(0, ...Object.values(S.homes).map(h => h.sort || 0)) + 1;
  S.homes[id] = Object.assign({ id }, rec);
  write("homes/" + id, rec);
  toast("保存しました");
  go(S.view.back === "visit" || S.view.isNew ? { name: "visit", id } : { name: "list" });
}

/* --- settings --- */
function viewSettings(){
  const d = S.view.draft;
  const sample = { name: "佐藤様" }, iso = new Date().toISOString();
  return '<div class="bar"><div class="bar-top"><button class="navbtn" data-act="back">キャンセル</button><span class="t">設定</span><button class="navbtn" data-act="settingsSave">保存</button></div></div>'
    + '<div class="card"><div class="field"><label for="s-staff">担当者名</label><input type="text" id="s-staff" value="' + esc(d.staff) + '" placeholder="例：松井"><span class="hint">文面に {担当} と書いた場所に入ります。</span></div></div>'
    + '<div class="card"><h2>業務日報</h2>'
    + '<div class="field"><label for="s-fullname">日報用のお名前（漢字フルネーム）</label><input type="text" id="s-fullname" value="' + esc(d.fullName) + '" autocomplete="name"></div>'
    + '<div class="field"><label for="s-email">日報用のメールアドレス</label><input type="email" id="s-email" value="' + esc(d.email) + '" autocomplete="email" autocapitalize="off" spellcheck="false"></div>'
    + '<div class="field"><label for="s-report">日報フォームのアドレス</label><input type="text" id="s-report" value="' + esc(d.reportUrl) + '" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://docs.google.com/forms/…">'
    + '<span class="hint">このスマホの中だけに保存されます。自動入力用のアドレスを入れると、日報の内容が入った状態でフォームが開きます。</span></div></div>'
    + '<div class="card"><div class="field"><label for="s-in">入室の文面</label><textarea id="s-in">' + esc(d.inTpl) + '</textarea></div>'
    + '<div class="field"><label for="s-out">退出の文面</label><textarea id="s-out">' + esc(d.outTpl) + '</textarea></div>'
    + '<p class="hint small muted">使える差し込み：{家庭}　{時刻}　{日付}　{担当}</p>'
    + '<p class="lbl">見本</p><div class="msgbox" id="s-prev">' + esc(message("in", sample, iso, d) + "\n" + message("out", sample, iso, d)) + '</div>'
    + '<button class="linkbtn small" data-act="settingsReset" style="align-self:flex-start">最初の文面に戻す</button></div>'
    + '<button class="btn big primary" data-act="settingsSave">保存する</button>'
    + viewBackup();
}
function viewBackup(){
  const p = S.view.pendingImport;
  let out = '<div class="card"><h2>データの書き出し・読み込み</h2>'
    + '<p class="small muted">登録した家庭・設定・最近の記録を1つのファイルに保存します。機種変更のときは、新しいスマホでこのファイルを読み込んでください。</p>'
    + '<div class="btnrow"><button class="btn sm" data-act="export">書き出す</button><label class="btn sm" for="s-import">読み込む</label></div>'
    + '<input type="file" id="s-import" accept=".json,application/json" hidden>';
  if (p) {
    out += '<div class="alert warn"><p class="num">「' + esc(p.fileName) + '」を読み込むと、今の家庭 ' + Object.keys(S.homes).length + ' 件と記録が、ファイルの内容（家庭 ' + Object.keys(p.data.homes).length + ' 件）に置き換わります。</p>'
      + '<div class="btnrow"><button class="btn sm warn" data-act="importApply">置き換える</button><button class="btn sm" data-act="importCancel">やめる</button></div></div>';
  }
  return out + '</div>';
}
function exportData(){
  const data = { app: EXPORT_APP, version: 1, exportedAt: new Date().toISOString(), homes: S.homes, visits: S.visits, settings: S.settings, log: S.log, reports: S.reports };
  const d = new Date();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
  a.download = "家事代行チェックリスト_" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast("書き出しました");
}
function readImport(file){
  const r = new FileReader();
  r.onload = () => {
    let data = null;
    try { data = JSON.parse(r.result); } catch (e) {}
    if (!data || data.app !== EXPORT_APP || !data.homes || typeof data.homes !== "object") {
      toast("このアプリで書き出したファイルではありません"); return;
    }
    S.view.pendingImport = { fileName: file.name, data };
    render();
  };
  r.onerror = () => toast("ファイルを読み込めませんでした");
  r.readAsText(file);
}
function applyImport(){
  const data = S.view.pendingImport.data;
  const next = {
    homes: data.homes || {}, visits: data.visits || {},
    settings: Object.assign({}, DEFAULT_SETTINGS, data.settings || {}),
    log: Array.isArray(data.log) ? data.log.slice(0, LOG_MAX) : [],
    reports: data.reports && typeof data.reports === "object" ? data.reports : {}
  };
  if (S.mode === "db") {
    Object.keys(S.homes).forEach(id => { if (!next.homes[id]) write("homes/" + id, null); });
    Object.keys(S.visits).forEach(id => { if (!next.visits[id]) write("visits/" + id, null); });
    Object.keys(next.homes).forEach(id => write("homes/" + id, next.homes[id]));
    Object.keys(next.visits).forEach(id => write("visits/" + id, next.visits[id]));
  }
  Object.assign(S, next);
  write("settings/main", S.settings);
  write("log/recent", { entries: S.log });
  toast("読み込みました");
  go({ name: "list" });
}
function updatePreview(){
  const el = document.getElementById("s-prev"); if (!el) return;
  const iso = new Date().toISOString(), sample = { name: "佐藤様" }, d = S.view.draft;
  el.textContent = message("in", sample, iso, d) + "\n" + message("out", sample, iso, d);
}

/* ---------- events ---------- */
app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const act = el.dataset.act, V = S.view;
  switch (act) {
    case "open": go({ name: "visit", id: el.dataset.id }); break;
    case "back": go({ name: "list" }); break;
    case "settings": go({ name: "settings", draft: clone(S.settings) }); break;
    case "new": go({ name: "edit", isNew: true, back: "list", draft: { name: "", memo: "", start: "", end: "", days: [], tasks: [], finals: DEFAULT_FINALS.map(t => ({ id: uid(), text: t })) } }); break;
    case "edit": {
      const h = S.homes[el.dataset.id];
      go({ name: "edit", isNew: false, back: "visit", draft: { id: h.id, name: h.name || "", memo: h.memo || "", start: h.start || "", end: h.end || "", days: clone(h.days || []), sort: h.sort || 0, tasks: clone(h.tasks || []), finals: clone(h.finals || []) } });
      break;
    }
    case "ui": {
      if (el.dataset.on) S.ui[el.dataset.key] = true; else delete S.ui[el.dataset.key];
      render();
      break;
    }
    case "enter": {
      // リンクの遷移（LINEを開く）はそのまま進め、画面の更新は後で行う
      const iso = new Date().toISOString(), id = V.id;
      el.href = lineUrl(message("in", S.homes[id], iso));
      setTimeout(() => enter(id, iso), 60);
      break;
    }
    case "exit": {
      const iso = new Date().toISOString(), id = V.id;
      el.href = lineUrl(message("out", S.homes[id], iso));
      setTimeout(() => exitVisit(id, iso), 60);
      break;
    }
    case "cancelIn": cancelEntry(V.id); break;
    case "enterAt": {
      const t = document.getElementById("v-enter").value;
      if (!t) { toast("時刻を選んでください"); break; }
      enter(V.id, atTime(new Date().toISOString(), t), true); S.ui = {}; render();
      toast("入室を記録しました");
      break;
    }
    case "editIn": {
      const t = document.getElementById("v-in").value, v = S.visits[V.id];
      if (!t || !v) { toast("時刻を選んでください"); break; }
      v.inAt = atTime(v.inAt, t); v.inEdited = true;
      write("visits/" + V.id, v); S.ui = {}; render();
      toast("入室時刻を直しました");
      break;
    }
    case "exitAt": {
      const t = document.getElementById("v-exit").value, v = S.visits[V.id];
      if (!t || !v) { toast("時刻を選んでください"); break; }
      const outAt = atTime(v.inAt, t);
      if (new Date(outAt) < new Date(v.inAt)) { toast("退出時刻が入室時刻より前になっています"); break; }
      exitVisit(V.id, outAt, true);
      break;
    }
    case "logEdit": go({ name: "logEdit", idx: Number(el.dataset.idx) }); break;
    case "logSave": {
      const e = S.log[V.idx], tin = document.getElementById("l-in").value, tout = document.getElementById("l-out").value;
      if (!e || !tin || !tout) { toast("時刻を選んでください"); break; }
      const inAt = atTime(e.inAt, tin), outAt = atTime(e.inAt, tout);
      if (new Date(outAt) < new Date(inAt)) { toast("退出時刻が入室時刻より前になっています"); break; }
      if (inAt !== e.inAt || outAt !== e.outAt) {
        Object.assign(e, { inAt, outAt, edited: true });
        write("log/recent", { entries: S.log });
      }
      toast("保存しました"); go({ name: "list" });
      break;
    }
    case "logDelete": {
      S.log.splice(V.idx, 1);
      write("log/recent", { entries: S.log });
      toast("記録を削除しました"); go({ name: "list" });
      break;
    }
    case "task": toggle(V.id, "task", el.dataset.item); break;
    case "final": toggle(V.id, "final", el.dataset.item); break;
    case "copy": copyText(el.dataset.text); break;
    case "add": addItem(el.dataset.list); break;
    case "wk": {
      const days = V.draft.days = V.draft.days || [], w = el.dataset.w, i = days.indexOf(w);
      if (i >= 0) days.splice(i, 1); else days.push(w);
      el.setAttribute("aria-pressed", i >= 0 ? "false" : "true");
      break;
    }
    case "up": case "down": case "rm": {
      const items = V.draft[el.dataset.list], i = items.findIndex(t => t.id === el.dataset.item);
      if (i < 0) break;
      if (act === "rm") items.splice(i, 1);
      else { const j = act === "up" ? i - 1 : i + 1; if (j >= 0 && j < items.length) [items[i], items[j]] = [items[j], items[i]]; }
      renderEditor(el.dataset.list);
      break;
    }
    case "editCancel": go(V.back === "visit" && V.draft.id ? { name: "visit", id: V.draft.id } : { name: "list" }); break;
    case "editSave": saveEdit(); break;
    case "homeDelete": {
      const id = V.draft.id;
      delete S.homes[id]; delete S.visits[id];
      write("homes/" + id, null); write("visits/" + id, null);
      toast("削除しました"); go({ name: "list" });
      break;
    }
    case "settingsSave": {
      const d = V.draft;
      const url = d.reportUrl.trim();
      if (url && !/^https:\/\//.test(url)) { toast("日報フォームのアドレスは https:// から始まるものを入れてください"); break; }
      S.settings = { staff: d.staff.trim(), inTpl: d.inTpl.trim() || DEFAULT_SETTINGS.inTpl, outTpl: d.outTpl.trim() || DEFAULT_SETTINGS.outTpl, fullName: d.fullName.trim(), email: (d.email || "").trim(), reportUrl: url };
      write("settings/main", S.settings); toast("保存しました"); go({ name: "list" });
      break;
    }
    case "sample": {
      const id = uid();
      const rec = {
        name: SAMPLE_HOME.name, memo: SAMPLE_HOME.memo, start: SAMPLE_HOME.start, end: SAMPLE_HOME.end, days: SAMPLE_HOME.days.slice(),
        sort: Math.max(0, ...Object.values(S.homes).map(h => h.sort || 0)) + 1,
        tasks: SAMPLE_HOME.tasks.map(t => ({ id: uid(), text: t })),
        finals: DEFAULT_FINALS.map(t => ({ id: uid(), text: t }))
      };
      S.homes[id] = Object.assign({ id }, rec);
      write("homes/" + id, rec);
      render();
      break;
    }
    case "report": go({ name: "report", day: el.dataset.day }); break;
    case "openForm": {
      // リンクの遷移はそのまま進め、開く直前に最新の入力内容を入れる
      if (hasPrefill(S.settings.reportUrl)) el.href = prefillUrl(S.settings.reportUrl, V.day);
      break;
    }
    case "copyField": {
      const f = document.getElementById(el.dataset.field);
      if (!f || !f.value.trim()) { toast("コピーする内容がありません"); break; }
      copyText(f.value, f);
      break;
    }
    case "reportSent": {
      const on = !!el.dataset.on;
      saveReport(V.day, { sent: on, sentAt: on ? new Date().toISOString() : null });
      toast(on ? "送信済みにしました" : "未送信に戻しました");
      if (on) go({ name: "list" }); else render();
      break;
    }
    case "export": exportData(); break;
    case "importApply": applyImport(); break;
    case "importCancel": delete V.pendingImport; render(); break;
    case "settingsReset": {
      V.draft.inTpl = DEFAULT_SETTINGS.inTpl; V.draft.outTpl = DEFAULT_SETTINGS.outTpl;
      document.getElementById("s-in").value = V.draft.inTpl; document.getElementById("s-out").value = V.draft.outTpl;
      updatePreview();
      break;
    }
  }
});
app.addEventListener("input", e => {
  const t = e.target, V = S.view;
  if (V.name === "edit") {
    if (t.id === "f-name") V.draft.name = t.value;
    else if (t.id === "f-memo") V.draft.memo = t.value;
    else if (t.id === "f-start") V.draft.start = t.value;
    else if (t.id === "f-end") V.draft.end = t.value;
    else if (t.dataset.list) { const it = V.draft[t.dataset.list].find(x => x.id === t.dataset.item); if (it) it.text = t.value; }
  } else if (V.name === "settings") {
    if (t.id === "s-staff") V.draft.staff = t.value;
    if (t.id === "s-fullname") V.draft.fullName = t.value;
    if (t.id === "s-email") V.draft.email = t.value;
    if (t.id === "s-report") V.draft.reportUrl = t.value;
    if (t.id === "s-in") V.draft.inTpl = t.value;
    if (t.id === "s-out") V.draft.outTpl = t.value;
    updatePreview();
  }
});
app.addEventListener("change", e => {
  if (e.target.id === "s-import" && e.target.files && e.target.files[0]) readImport(e.target.files[0]);
  if (S.view.name === "edit" && (e.target.id === "f-start" || e.target.id === "f-end")) S.view.draft[e.target.id === "f-start" ? "start" : "end"] = e.target.value;
});
app.addEventListener("keydown", e => {
  const t = e.target;
  if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229 && t.dataset && t.dataset.list && S.view.name === "edit") {
    e.preventDefault(); addItem(t.dataset.list, t.dataset.item);
  }
});

/* ---------- 画面を消さない（作業中のみ） ---------- */
let wakeLock = null, wantAwake = false;
async function keepAwake(on){
  wantAwake = on;
  try {
    if (on && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); }
    else if (!on && wakeLock) { const w = wakeLock; wakeLock = null; await w.release(); }
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && wantAwake) keepAwake(true); });

/* ---------- start ---------- */
render();
if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("db").then(ns => { if (ns) { db = ns; startDb(); } else startLocal(); }).catch(startLocal);
} else {
  startLocal();
}
})();
</script>
</body>
</html>
